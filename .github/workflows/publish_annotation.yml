name: Annotation Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/annotation/pubspec.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate
        uses: ./.github/actions/flutter-validate
        with:
          path: packages/annotation

      - name: Publish
        uses: ./.github/actions/pub-publish
        with:
          credentials: ${{ secrets.CREDENTIAL_JSON }}
          path: packages/annotation
