name: Pull Request Checker

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate annotation
        uses: ./.github/actions/flutter-validate
        with:
          path: packages/annotation
          skip_sarif: true

      - name: Validate codegen
        uses: ./.github/actions/flutter-validate
        with:
          path: packages/codegen
          skip_sarif: true

      - name: Validate json_theme
        uses: ./.github/actions/flutter-validate
        with:
          generate_code: true
          path: packages/json_theme
